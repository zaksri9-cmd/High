<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Earn from your Films</title>

<style>
/* ===== الألوان الذهبية والخلفية ===== */
:root {
  --gold: #FFD700;
  --gold-light: #FFF1A8;
  --dark: #090909;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at top, #493700 0%, #171100 35%, #050505 75%);
}

/* ===== الإطار الرئيسي ===== */
.article {
  max-width: 950px;
  margin: 35px auto;
  padding: 30px;
  border: 1px solid #B8860B;
  border-radius: 18px;
  background: linear-gradient(145deg, #17130a, #080808);
  box-shadow: 0 0 30px rgba(255, 215, 0, 0.16);
  position: relative;
  overflow: hidden;
}

/* ===== رموز الدولار ===== */
.dollar {
  text-align: center;
  font-size: 65px;
  font-weight: bold;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  margin: 5px 0 20px;
}

/* ===== العنوان الذهبي ===== */
h1 {
  color: var(--gold);
  text-align: center;
  font-size: 30px;
  margin: 15px 0;
  text-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
}

/* ===== الخط الذهبي ===== */
.gold-line {
  width: 100px;
  height: 3px;
  background: linear-gradient(to right, #8B6508, #FFF1A8, #8B6508);
  margin: 20px auto 30px;
  border-radius: 10px;
}

/* ===== نص المقال ===== */
p {
  color: #E8E0C8;
  font-size: 17px;
  line-height: 1.9;
}

/* ===== مساحة الهاتف ===== */
@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .article {
    margin: 15px auto;
    padding: 20px;
  }

  h1 {
    font-size: 24px;
  }

  .dollar {
    font-size: 52px;
  }

  p {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<main class="articel1">
  <div class="dollar">$</div>

  <h1>Earn from your Films</h1>

  <div class="gold-line"></div>

  <p>
    Welcome to our complete guide.
    Discover how to earn from your films
    and explore new opportunities.
  </p>

  <!-- اكتب محتوى مقالك هنا -->

</main>

</body>
</html>
